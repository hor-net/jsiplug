<html lang="en" data-bs-theme="light" style="font-size:16px">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>jsiplug example</title>
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <link href="https://fonts.googleapis.com/css2?family=Titillium+Web&amp;family=Oxanium&amp;display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.4/font/bootstrap-icons.css">
    </head>
    <body class="bg-body container-fluid">
        <h1>Controls examples</h1>
        <hr>
        
        <h3>Draggable input</h3>
        <label for="draggable-input" class="col-form-label">Draggable input</label>
        <div class="input-group input-group-sm text-center mx-auto control">
            <input type="number" class="form-control text-end" aria-label="draggable input" id="draggable-input" data-controltype="draggable-input" data-paramid="1" data-min="1" data-max="100" data-step="1" data-default="50">
            <span class="input-group-text">%</span>
        </div>
        
        <h3>Select</h3>
        <label for="select-input" class="col-form-label">Select input</label>
        <select class="form-select form-select-sm control" id="select-input" data-controltype="select" data-paramid="2">
            <option value="0">Option 1</option>
            <option value="1">Option 2</option>
            <option value="2">Option 3</option>
        </select>
        
        <h3>Switch</h3>
        <div class="form-check form-switch">
            <input class="form-check-input control" type="checkbox" role="switch" id="switch-on-off" data-controltype="switch" data-paramid="3">
        </div>
        
        <h3>Knob</h3>
        <div class="w-25">
            <svg class="col-5 p-0" viewBox="0 0 34 34" version="1.1" data-controltype="knob" data-paramid="4" data-min="1" data-max="100" data-step="1" data-default="25" id="knob" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg">       
                <g id="layer1" class="knob">
                    <g class="rotator control knob-body" style="transform-origin-x: 50%; transform-origin-y: 50%;">
                        <circle cx="17" cy="17" r="15" fill="#fff" stroke="#000"></circle>
                        <rect width="2" height="15" x="16" y="1" rx="0.7" ry="0.7" class="knob-indicator"></rect>
                    </g>
                </g>
            </svg>
            <div class="input-group input-group-sm text-center mx-auto control">
                <input type="number" class="form-control text-end" aria-label="draggable input" id="knob-val">
                <span class="input-group-text">%</span>
            </div>
        </div>
        <h3>Spectrum</h3>
        <div class="container-fluid p-3">
            <!-- Add decay time slider -->
            <div class="mb-3">
                <label for="decay-time-slider" class="form-label">Decay Time: <span id="decay-time-display">300ms</span></label>
                <input type="range" class="form-range" id="decay-time-slider" 
                       min="0" max="100" value="50">
            </div>
            
            <!-- Add spectrum layer controls -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="spectrum1-toggle" checked>
                                <label class="form-check-label" for="spectrum1-toggle">Spectrum 1</label>
                            </div>
                        </div>
                        <div class="card-body">
                            <label for="spectrum1-zindex" class="form-label">Z-Index</label>
                            <input type="range" class="form-range" id="spectrum1-zindex" min="0" max="10" value="0">
                            <div class="mt-3">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="spectrum1-trail-toggle">
                                    <label class="form-check-label" for="spectrum1-trail-toggle">Scia</label>
                                </div>
                                <label for="spectrum1-trail-duration" class="form-label">Durata: <span id="spectrum1-trail-display">1.0s</span></label>
                                <input type="range" class="form-range" id="spectrum1-trail-duration" min="0" max="100" value="50">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="spectrum2-toggle" checked>
                                <label class="form-check-label" for="spectrum2-toggle">Spectrum 2</label>
                            </div>
                        </div>
                        <div class="card-body">
                            <label for="spectrum2-zindex" class="form-label">Z-Index</label>
                            <input type="range" class="form-range" id="spectrum2-zindex" min="0" max="10" value="1">
                            <div class="mt-3">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="spectrum2-trail-toggle">
                                    <label class="form-check-label" for="spectrum2-trail-toggle">Scia</label>
                                </div>
                                <label for="spectrum2-trail-duration" class="form-label">Durata: <span id="spectrum2-trail-display">1.0s</span></label>
                                <input type="range" class="form-range" id="spectrum2-trail-duration" min="0" max="100" value="50">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div id="spectrum-chart" 
                style="width: 100%; height: 400px; margin: 0 auto;" 
                data-controltype="spectrum-chart" 
                data-messageid="1"
                data-mindb="-120"
                data-maxdb="0"
                data-decaytime="300">
            </div>
            <script>
                addEventListener('ControlSetup', (event) => {
                    const chart = GetControlById("spectrum-chart");
                    const decaySlider = document.getElementById('decay-time-slider');
                    const decayDisplay = document.getElementById('decay-time-display');
                    const spectrum1TrailToggle = document.getElementById('spectrum1-trail-toggle');
                    const spectrum1TrailDuration = document.getElementById('spectrum1-trail-duration');
                    const spectrum1TrailDisplay = document.getElementById('spectrum1-trail-display');
                    const spectrum2TrailToggle = document.getElementById('spectrum2-trail-toggle');
                    const spectrum2TrailDuration = document.getElementById('spectrum2-trail-duration');
                    const spectrum2TrailDisplay = document.getElementById('spectrum2-trail-display');
                    
                    // Add two spectrum layers
                    chart.addSpectrum('spectrum1', {
                        zIndex: 0,
                        preferences: {
                            lineColor: '#FF4081',
                            fillColor: 'rgba(255, 64, 129, 0.3)',
                            peakColor: '#FFC107'
                        }
                    });

                    chart.addSpectrum('spectrum2', {
                        zIndex: 1,
                        preferences: {
                            lineColor: '#4CAF50',
                            fillColor: 'rgba(76, 175, 80, 0.3)',
                            peakColor: '#FF5722'
                        }
                    });

                    // Setup spectrum toggle controls
                    const spectrum1Toggle = document.getElementById('spectrum1-toggle');
                    const spectrum2Toggle = document.getElementById('spectrum2-toggle');
                    const spectrum1ZIndex = document.getElementById('spectrum1-zindex');
                    const spectrum2ZIndex = document.getElementById('spectrum2-zindex');

                    spectrum1Toggle.addEventListener('change', (e) => {
                        if (e.target.checked) {
                            chart.addSpectrum('spectrum1', {
                                zIndex: parseInt(spectrum1ZIndex.value),
                                preferences: {
                                    lineColor: '#FF4081',
                                    fillColor: 'rgba(255, 64, 129, 0.3)',
                                    peakColor: '#FFC107'
                                }
                            });
                        } else {
                            chart.removeSpectrum('spectrum1');
                        }
                    });

                    spectrum2Toggle.addEventListener('change', (e) => {
                        if (e.target.checked) {
                            chart.addSpectrum('spectrum2', {
                                zIndex: parseInt(spectrum2ZIndex.value),
                                preferences: {
                                    lineColor: '#4CAF50',
                                    fillColor: 'rgba(76, 175, 80, 0.3)',
                                    peakColor: '#FF5722'
                                }
                            });
                        } else {
                            chart.removeSpectrum('spectrum2');
                        }
                    });

                    spectrum1ZIndex.addEventListener('input', (e) => {
                        chart.addSpectrum('spectrum1', {
                            zIndex: parseInt(e.target.value),
                            preferences: {
                                lineColor: '#FF4081',
                                fillColor: 'rgba(255, 64, 129, 0.3)',
                                peakColor: '#FFC107'
                            }
                        });
                    });

                    spectrum2ZIndex.addEventListener('input', (e) => {
                        chart.addSpectrum('spectrum2', {
                            zIndex: parseInt(e.target.value),
                            preferences: {
                                lineColor: '#4CAF50',
                                fillColor: 'rgba(76, 175, 80, 0.3)',
                                peakColor: '#FF5722'
                            }
                        });
                    });
                    
                    // Convert slider value (0-100) to decay time (100ms-10000ms) logarithmically
                    const getDecayTime = (sliderValue) => {
                        const minLog = Math.log10(100);    // 100ms
                        const maxLog = Math.log10(10000);  // 10s
                        const scale = (maxLog - minLog) / 100;
                        return Math.round(Math.pow(10, minLog + (sliderValue * scale)));
                    };
                    const getTrailDuration = (sliderValue) => {
                        const minLog = Math.log10(100);
                        const maxLog = Math.log10(5000);
                        const scale = (maxLog - minLog) / 100;
                        return Math.round(Math.pow(10, minLog + (sliderValue * scale)));
                    };
                    
                    // Update decay time when slider changes
                    decaySlider.addEventListener('input', (e) => {
                        const decayTime = getDecayTime(e.target.value);
                        const displayText = decayTime >= 1000 ? 
                            `${(decayTime/1000).toFixed(1)}s` : 
                            `${decayTime}ms`;
                        decayDisplay.textContent = displayText;
                        chart.updatePreferences({ decayTime });
                    });

                    spectrum1TrailToggle.addEventListener('change', (e) => {
                        chart.updatePreferences({ spectrumPreferences: { spectrum1: { trailEnabled: e.target.checked } } });
                    });
                    spectrum1TrailDuration.addEventListener('input', (e) => {
                        const ms = getTrailDuration(e.target.value);
                        spectrum1TrailDisplay.textContent = ms >= 1000 ? `${(ms/1000).toFixed(1)}s` : `${ms}ms`;
                        chart.updatePreferences({ spectrumPreferences: { spectrum1: { trailDuration: ms } } });
                    });
                    spectrum2TrailToggle.addEventListener('change', (e) => {
                        chart.updatePreferences({ spectrumPreferences: { spectrum2: { trailEnabled: e.target.checked } } });
                    });
                    spectrum2TrailDuration.addEventListener('input', (e) => {
                        const ms = getTrailDuration(e.target.value);
                        spectrum2TrailDisplay.textContent = ms >= 1000 ? `${(ms/1000).toFixed(1)}s` : `${ms}ms`;
                        chart.updatePreferences({ spectrumPreferences: { spectrum2: { trailDuration: ms } } });
                    });

                    chart.updatePreferences({
                        grid: {
                            normalLine: {
                                width: 1,
                                color: 'rgba(0,0,0,0.3)'
                            },
                            emphasizedLine: {
                                width: 1,
                                color: 'rgba(0,0,0,1)'
                            }
                        },
                        text: {
                            color: 'rgba(0,0,0,0.8)',
                            normal: {
                                font: 'Titillium Web',
                                size: 12,
                                weight: 'normal'
                            },
                            emphasized: {
                                font: 'Titillium Web',
                                size: 12,
                                weight: 'normal'
                            }
                        },
                        background: 'rgb(225,225,225)',
                        decayTime: getDecayTime(50),
                        spectrumPreferences: {
                            spectrum1: { trailEnabled: false, trailDuration: getTrailDuration(50) },
                            spectrum2: { trailEnabled: false, trailDuration: getTrailDuration(50) }
                        }
                    });

                    // Generate different spectrum data for each layer
                    setInterval(() => {
                        // Calculate frequencies (20Hz to 20000Hz, step 5Hz)
                        const numPoints = Math.floor((20000 - 20) / 5) + 1;
                        const frequencies = new Array(numPoints).fill(0).map((_, index) => 20 + (index * 5));
                        
                        // Data for spectrum1 (higher frequencies emphasized)
                        const data1 = new Array(numPoints).fill(0).map((_, index) => {
                            const freq = frequencies[index];
                            const baseLevel = -80;
                            const randomVariation = Math.random() * 40;
                            const freqFactor = Math.sin(2 * Math.PI * freq / 1000) * 20;
                            return baseLevel + randomVariation + freqFactor;
                        });
                        
                        // Data for spectrum2 (lower frequencies emphasized)
                        const data2 = new Array(numPoints).fill(0).map((_, index) => {
                            const freq = frequencies[index];
                            const baseLevel = -100;
                            const randomVariation = Math.random() * 30;
                            const freqFactor = Math.cos(2 * Math.PI * freq / 500) * 30;
                            return baseLevel + randomVariation + freqFactor;
                        });
                        
                        chart.updateSpectrum('spectrum1', data1, frequencies);
                        chart.updateSpectrum('spectrum2', data2, frequencies);
                    }, 50);
                });
            </script>
        </div>
        <hr>
        <h3>Oscilloscope</h3>
        <div class="container-fluid p-3">
            <div class="row mb-3">
                <div class="col-md-4">
                    <label for="scope-duration" class="form-label">Duration: <span id="scope-duration-display">0.10s</span></label>
                    <input type="range" class="form-range" id="scope-duration" min="1" max="100" value="30">
                </div>
                <div class="col-md-4">
                    <label for="scope-freq" class="form-label">Source frequency: <span id="scope-freq-display">440Hz</span></label>
                    <input type="range" class="form-range" id="scope-freq" min="20" max="2000" value="440">
                </div>
                <div class="col-md-4 d-flex align-items-end">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="scope-trigger-toggle">
                        <label class="form-check-label" for="scope-trigger-toggle">Trigger on trace 1</label>
                    </div>
                </div>
            </div>

            <div id="oscilloscope"
                 style="width: 100%; height: 280px; margin: 0 auto;"
                 data-controltype="oscilloscope"
                 data-messageid="2"
                 data-duration="0.1"
                 data-samplerate="48000"
                 data-minvalue="-1"
                 data-maxvalue="1"
                 data-background="rgb(245,245,245)"
                 data-gridcolor="rgba(0,0,0,0.25)"
                 data-gridemphasizedcolor="rgba(0,0,0,0.6)"
                 data-textcolor="rgba(0,0,0,0.8)">
            </div>
            <script>
                addEventListener('ControlSetup', (event) => {
                    const scope = GetControlById('oscilloscope');
                    if (!scope) return;

                    // Two demo traces with different colors / gains / offsets.
                    scope.addTrace('traceA', {
                        color: '#FF4081',
                        lineWidth: 1.5,
                        gain: 1.0,
                        offset: 0.0,
                        zIndex: 0
                    });
                    scope.addTrace('traceB', {
                        color: '#4CAF50',
                        lineWidth: 1.5,
                        gain: 0.6,
                        offset: 0.2,
                        zIndex: 1
                    });

                    // Slider helpers -----------------------------------------------------
                    const durationSlider = document.getElementById('scope-duration');
                    const durationDisplay = document.getElementById('scope-duration-display');
                    const freqSlider = document.getElementById('scope-freq');
                    const freqDisplay = document.getElementById('scope-freq-display');
                    const triggerToggle = document.getElementById('scope-trigger-toggle');

                    const sliderToDuration = (sliderValue) => {
                        // Log mapping from 0.01s to 5s over slider range 1..100.
                        const minLog = Math.log10(0.01);
                        const maxLog = Math.log10(5.0);
                        const t = (sliderValue - 1) / 99;
                        return Math.pow(10, minLog + t * (maxLog - minLog));
                    };
                    const formatDuration = (s) => s >= 1 ? `${s.toFixed(2)}s` : `${(s * 1000).toFixed(1)}ms`;

                    durationSlider.addEventListener('input', (e) => {
                        const sec = sliderToDuration(parseInt(e.target.value));
                        durationDisplay.textContent = formatDuration(sec);
                        // MultiOscilloscope doesn't have a runtime resize API in
                        // this build: ring-buffer capacity is fixed at construction
                        // time. The slider just shows the duration for reference.
                    });

                    freqSlider.addEventListener('input', (e) => {
                        freqDisplay.textContent = `${e.target.value}Hz`;
                    });

                    // Trigger toggle is a UI-only knob in this demo (no trigger
                    // engine wired into the current MultiOscilloscope API).
                    triggerToggle.addEventListener('change', () => { /* no-op */ });

                    // Demo signal source -------------------------------------------------
                    // Drives both traces with synthetic audio so the oscilloscope
                    // has something to render without any DSP plumbing.
                    let phaseA = 0;
                    let phaseB = 0;
                    const sampleRate = 48000;
                    const chunkSize = 256;

                    setInterval(() => {
                        const freq = parseFloat(freqSlider.value);
                        const chunk = new Float32Array(chunkSize);
                        const chunkB = new Float32Array(chunkSize);
                        const dPhaseA = 2 * Math.PI * freq / sampleRate;
                        const dPhaseB = 2 * Math.PI * (freq * 0.5) / sampleRate;
                        for (let i = 0; i < chunkSize; i++) {
                            chunk[i] = 0.7 * Math.sin(phaseA) + 0.2 * Math.sin(phaseA * 3.1);
                            chunkB[i] = 0.6 * Math.sin(phaseB);
                            phaseA += dPhaseA;
                            phaseB += dPhaseB;
                        }
                        scope.pushSamples('traceA', chunk);
                        scope.pushSamples('traceB', chunkB);
                    }, 1000 / 60);
                });
            </script>
        </div>
        <hr>
        <script type="text/javascript" src="iplug2.js"></script>
        <script type="text/javascript" src="icontrols.js"></script>
        <script type="text/javascript" src="iSpectrumChart.js"></script>
        <script type="text/javascript" src="MultiOscilloscope.js"></script>
    </body>
</html>
